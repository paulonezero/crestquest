[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crest-quest"
version = "0.1.0"
description = "A server-authoritative football crest guessing game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "itsdangerous==2.2.0",
  "Pillow==11.3.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.10",
]
importer = [
  "CairoSVG==2.9.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
]

[tool.setuptools.packages.find]
include = ["server*", "src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
